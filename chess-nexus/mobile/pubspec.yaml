name: chess_nexus
description: "CHESS NEXUS – Beyond the Board. Premier Cross-Platform Competitive Chess Platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1

  # Local Persistence & Secure Storage
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Networking & Real-Time
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  jwt_decode: ^0.3.1

  # Chess Logic & Stockfish
  chess: ^0.8.1

  # Audio & Haptics
  audioplayers: ^6.0.0
  flutter_vibrate: ^1.3.0

  # Speech & Accessibility
  speech_to_text: ^6.6.1
  flutter_tts: ^4.0.2

  # UI & Design Tokens
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/pieces/classic/
    - assets/sounds/

