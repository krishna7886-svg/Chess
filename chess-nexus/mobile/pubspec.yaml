name: chess_nexus
description: "CHESS NEXUS – Beyond the Board. Premier Cross-Platform Competitive Chess Platform."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: any
  go_router: any

  # Local Persistence & Secure Storage
  drift: any
  sqlite3_flutter_libs: any
  flutter_secure_storage: any
  shared_preferences: any

  # Networking & Real-Time
  dio: any
  web_socket_channel: any
  jwt_decode: any

  # Chess Logic & Stockfish
  chess: any

  # Audio & Haptics
  audioplayers: any

  # Voice-First Chess Speech Recognition
  speech_to_text: ^6.6.1


  # UI & Design Tokens
  google_fonts: any
  flutter_svg: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  drift_dev: any
  build_runner: any

flutter:
  uses-material-design: true

  assets:
    - assets/pieces/classic/
    - assets/sounds/
