name: CHESS NEXUS — Android Build

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android Debug APK Build
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.27.x
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.27.x'
          cache: true

      - name: Verify Environment Diagnostics
        run: |
          flutter --version
          flutter doctor -v

      - name: Precache Flutter Android Artifacts
        working-directory: chess-nexus/mobile
        run: flutter precache --android

      - name: Resolve Mobile Dependencies
        working-directory: chess-nexus/mobile
        run: flutter pub get

      - name: Format Dart Code
        working-directory: chess-nexus/mobile
        run: dart format lib test

      - name: Run Flutter Static Analysis
        working-directory: chess-nexus/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Automated Flutter Unit Tests
        working-directory: chess-nexus/mobile
        run: flutter test --coverage

      - name: Build Android Debug APK
        working-directory: chess-nexus/mobile
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-nexus-debug-apk
          path: chess-nexus/mobile/build/app/outputs/flutter-apk/app-debug.apk
