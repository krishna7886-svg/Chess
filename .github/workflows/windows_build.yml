name: CHESS NEXUS Official Windows Runner Build

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-flutter-build:
    name: Windows Runner (Flutter Test, Debug & Release APK, Play Store AAB)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Official Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter SDK & Environment Diagnostics
        run: |
          flutter --version
          flutter doctor -v

      - name: Resolve Mobile Dependencies
        working-directory: chess-nexus/mobile
        run: flutter pub get

      - name: Verify Dart Formatting
        working-directory: chess-nexus/mobile
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run Flutter Static Analysis
        working-directory: chess-nexus/mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Flutter Tests
        working-directory: chess-nexus/mobile
        run: flutter test --coverage

      - name: Compile Debug APK
        working-directory: chess-nexus/mobile
        run: flutter build apk --debug

      - name: Compile Release APK (Split per ABI)
        working-directory: chess-nexus/mobile
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=symbols/

      - name: Compile Google Play Store App Bundle (AAB)
        working-directory: chess-nexus/mobile
        run: flutter build appbundle --release --obfuscate --split-debug-info=symbols/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-nexus-debug-apk
          path: chess-nexus/mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chess-nexus-release-apks
          path: chess-nexus/mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload Google Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-nexus-release-aab
          path: chess-nexus/mobile/build/app/outputs/bundle/release/*.aab
