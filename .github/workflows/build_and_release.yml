name: CHESS NEXUS CI/CD Pipeline

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Test Suite & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chess-nexus/backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Authoritative Chess & Engine Tests
        run: |
          cd chess-nexus/backend
          pytest tests/test_chess_rules.py tests/test_glicko2.py tests/test_voice_parser.py tests/test_api_sync.py -v --cov=app

  mobile-test:
    name: Flutter Lint & Unit Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd chess-nexus/mobile
          flutter pub get

      - name: Run Dart Analyzer
        run: |
          cd chess-nexus/mobile
          flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: |
          cd chess-nexus/mobile
          flutter test --coverage

  build-android:
    name: Build Android Release (APK & AAB)
    needs: [backend-test, mobile-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Dependencies
        run: |
          cd chess-nexus/mobile
          flutter pub get

      - name: Build Release APKs (Split per ABI)
        run: |
          cd chess-nexus/mobile
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=symbols/

      - name: Build Play Store AAB
        run: |
          cd chess-nexus/mobile
          flutter build appbundle --release --obfuscate --split-debug-info=symbols/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chess-nexus-android-apks
          path: chess-nexus/mobile/build/app/outputs/flutter-apk/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-nexus-android-aab
          path: chess-nexus/mobile/build/app/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS Archive & Signed IPA
    needs: [backend-test, mobile-test]
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Dependencies and CocoaPods
        run: |
          cd chess-nexus/mobile
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS IPA
        run: |
          cd chess-nexus/mobile
          flutter build ipa --release --no-codesign --obfuscate --split-debug-info=symbols/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-nexus-ios-archive
          path: chess-nexus/mobile/build/ios/archive/*.xcarchive

